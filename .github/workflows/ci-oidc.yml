name: CI and AWS OIDC Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ca-central-1

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-latest

    env:
      AWS_DEFAULT_REGION: ca-central-1
      AWS_REGION: ca-central-1

      # Dummy credentials used only so boto3 can initialize during unit tests.
      # These are not real AWS credentials.
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_SESSION_TOKEN: testing

      # Prevent boto3 from trying the EC2 instance-metadata service.
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm run install:node

      - name: Run Node unit tests
        run: npm run test

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/functions/process-image/requirements-dev.txt

      - name: Run Python unit tests
        run: |
          python -m pytest src/functions/process-image/tests -v
        

      - name: Build TypeScript functions
        run: npm run build

      - name: Verify TypeScript artifacts
        run: |
          test -f src/functions/create-upload/dist/handler.js
          test -f src/functions/get-image/dist/handler.js

  aws-oidc:
    name: AWS OIDC Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Show GitHub repository identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository ID: $GITHUB_REPOSITORY_ID"
          echo "Owner ID: $GITHUB_REPOSITORY_OWNER_ID"
          echo "Ref: $GITHUB_REF"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::418295404794:role/SecureImageApiGitHubDeployRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: secure-image-api-github
          allowed-account-ids: 418295404794

      - name: Verify AWS identity
        run: aws sts get-caller-identity