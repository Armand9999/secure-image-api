name: Secure Image API CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ============================================================
  # CI
  # Runs for pull requests, pushes to main, and manual runs.
  # Does NOT receive AWS credentials.
  # ============================================================

  ci:
    name: Test, Validate and Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      AWS_REGION: ${{ vars.AWS_REGION }}

      # Dummy credentials only for boto3 initialization
      # during isolated Python unit tests.
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_SESSION_TOKEN: testing
      AWS_EC2_METADATA_DISABLED: "true"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install Node dependencies
        run: npm run install:node


      - name: Run Node unit tests
        run: npm run test


      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r src/functions/process-image/requirements-dev.txt


      - name: Run Python unit tests
        run: |
          python -m pytest \
            src/functions/process-image/tests \
            -v


      - name: Build TypeScript functions
        run: npm run build


      - name: Verify TypeScript build artifacts
        run: |
          test -f src/functions/create-upload/dist/handler.js
          test -f src/functions/get-image/dist/handler.js


      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Validate SAM template
        run: sam validate


      - name: Lint SAM template
        run: sam validate --lint


  # ============================================================
  # CD - DEV
  #
  # Runs only after CI passes and only from main.
  # This is the only job receiving AWS OIDC credentials.
  # ============================================================

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest

    needs:
      - ci

    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      - name: Install Node dependencies
        run: npm run install:node


      - name: Build TypeScript functions
        run: npm run build


      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: secure-image-api-deploy
          aws-region: ${{ vars.AWS_REGION }}


      - name: Verify assumed AWS identity
        run: aws sts get-caller-identity


      - name: Build SAM application
        run: sam build --use-container


      - name: Deploy dev stack
        run: |
          sam deploy \
            --stack-name "${{ vars.DEV_STACK_NAME }}" \
            --region "${{ vars.AWS_REGION }}" \
            --s3-bucket "${{ vars.SAM_ARTIFACT_BUCKET }}" \
            --role-arn "${{ vars.CFN_EXECUTION_ROLE_ARN }}" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
            